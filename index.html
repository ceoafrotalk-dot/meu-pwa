<!DOCTYPE html>
<html lang="pt-MZ">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Afrotalk - 100% Moçambicano</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#f5c518">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial}
body{background:#000;color:#fff;overflow-x:hidden}
header{background:#0f0f0f;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #222;position:sticky;top:0;z-index:50}
.header-left{display:flex;align-items:center;gap:8px}
.header-left h1{color:#f5c518;font-size:22px;font-weight:900;letter-spacing:-0.5px}
.header-left small{background:#f5c518;color:#000;padding:2px 5px;border-radius:4px;font-size:10px;font-weight:bold}
.header-right{display:flex;gap:16px;align-items:center;font-size:20px}
.header-right span{cursor:pointer}
.stories-bar{display:flex;gap:12px;overflow-x:auto;padding:12px 10px;background:#0a0a0a;border-bottom:1px solid #1a1a1a;scrollbar-width:none}
.stories-bar::-webkit-scrollbar{display:none}
.story{min-width:64px;text-align:center;cursor:pointer}
.story-ring{width:60px;height:60px;border-radius:50%;border:3px solid #f5c518;padding:2px;background:linear-gradient(45deg,#f5c518,#ff8a00);display:flex;align-items:center;justify-content:center;font-size:26px;margin:auto;position:relative}
.story-ring-inner{width:100%;height:100%;border-radius:50%;background:#222;display:flex;align-items:center;justify-content:center;border:2px solid #000}
.story-ring.visto{border-color:#444;background:#444}
.story span{font-size:11px;color:#ddd;display:block;margin-top:6px;max-width:64px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.add-story .story-ring{background:#111;border-style:dashed;border-color:#f5c518}
.post-box{background:#151515;padding:12px;border-bottom:1px solid #222;display:flex;gap:10px}
.post-box .avatar{width:38px;height:38px;background:#222;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.post-box-main{flex:1}
.post-box textarea{width:100%;background:#222;border:none;border-radius:18px;padding:12px 14px;color:#fff;resize:none;outline:none;font-size:15px}
.post-actions{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.post-actions-icons{display:flex;gap:14px;color:#f5c518;font-size:18px}
.btn-pub{background:#f5c518;color:#000;border:none;padding:8px 18px;border-radius:20px;font-weight:800;cursor:pointer}
.feed{padding-bottom:80px}
.post{background:#151515;margin:8px 0;border-bottom:1px solid #1a1a1a;padding:12px 14px}
.post-head{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.post-head .avatar{width:38px;height:38px;background:#333;border-radius:50%;display:flex;align-items:center;justify-content:center}
.post-head b{font-size:14px}
.post-head small{color:#777;font-size:12px}
.post-text{font-size:15px;line-height:1.4;margin:8px 0}
.actions{display:flex;gap:18px;margin-top:10px;color:#aaa;font-size:14px}
.actions span{cursor:pointer}
.actions span:hover{color:#f5c518}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#0f0f0f;display:flex;justify-content:space-around;padding:10px 0 14px 0;border-top:1px solid #222;z-index:40}
.bottom-nav span{font-size:22px;cursor:pointer}
.bottom-nav .active{color:#f5c518}
#searchBox{position:fixed;top:52px;left:0;right:0;background:#111;padding:10px;display:none;z-index:60;border-bottom:1px solid #222}
#searchBox input{width:100%;background:#222;border:none;border-radius:20px;padding:10px 15px;color:#fff;outline:none}
</style>
</head>
<body>

<header>
  <div class="header-left">
    <h1>Afrotalk</h1>
    <small>🔍</small>
  </div>
  <div class="header-right">
    <span onclick="toggleSearch()">🔍</span>
