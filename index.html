<!DOCTYPE html>
<html lang="pt-MZ">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Afrotalk</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#000;color:#fff;padding-bottom:80px}
header{background:#000;padding:12px;display:flex;justify-content:space-between;border-bottom:1px solid #111}
header h1{color:#f5c518;font-size:16px}
.user{margin:8px;background:#111;border-radius:16px;padding:8px 12px;font-size:11px;color:#888}
.user b{color:#fff}
.stories{display:flex;gap:12px;padding:12px;overflow-x:auto;border-bottom:1px solid #111}
.st{min-width:58px;text-align:center}
.ring{width:54px;height:54px;border-radius:50%;border:2.5px solid #ff2e2e;background:#1a1a1a;display:flex;align-items:center;justify-content:center;font-weight:bold}
.st span{font-size:10px;color:#aaa;display:block;margin-top:4px}
.box{margin:8px;background:#121212;border:1px solid #1e1e1e;border-radius:10px;padding:10px;display:flex;gap:8px}
.box input{flex:1;background:#1e1e1e;border:none;border-radius:20px;padding:10px;color:#fff}
.box button{background:#f5c518;border:none;border-radius:20px;padding:8px 14px;font-weight:bold}
.post{background:#121212;margin:8px;border:1px solid #1e1e1e;border-radius:10px;padding:10px}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#0a0a0a;border-top:1px solid #222;display:flex;justify-content:space-around;padding:12px 0}
</style>
</head>
<body>
<header><h1>Afrotalk</h1><span>🔍</span></header>
<div class="user">👋 <b>Arlindo Massingue</b> · Maputo, Moçambique | Masculino</div>
<div class="stories">
<div class="st"><div class="ring" style="border-color:#555;border-style:dashed">+</div><span>Teu story</span></div>
<div class="st"><div class="ring">J</div><span>João</span></div>
<div class="st"><div class="ring">M</div><span>Maria</span></div>
<div class="st"><div class="ring">A</div><span>Ana</span></div>
<div class="st"><div class="ring">D</div><span>DJ</span></div>
</div>
<div class="box"><input id="t" placeholder="O que está acontecendo, CEO?"><button onclick="postar()">Publicar</button></div>
<div id="feed">
<div class="post"><b>João Cossa</b> <small>· 5 min</small><div style="margin-top:6px">Alguém em Bilene hoje? Vamos fazer um churrasco!</div></div>
<div class="post"><b>Afrotalk Oficial</b> <small>· agora</small><div style="margin-top:6px">Bem-vindo ao Afrotalk! Rede 100% moçambicana 🇲🇿</div></div>
</div>
<div class="bottom"><span>🏠</span><span>👥</span><span>💬</span><span>🔔</span><span>⚙️</span></div>
<script>
function postar(){
let v=document.getElementById('t').value;
if(!v) return;
document.getElementById('feed').innerHTML='<div class=post><b>Tu</b> <small>· agora</small><div style=margin-top:6px>'+v+'</div></div>'+document.getElementById('feed').innerHTML;
document.getElementById('t').value='';
}
</script>
</body>
</html>
