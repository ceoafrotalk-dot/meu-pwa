<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AfroTalk - Solicitações</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#000;color:#fff;padding-bottom:70px}
.header{padding:15px;font-size:20px;font-weight:bold;border-bottom:1px solid #222;position:sticky;top:0;background:#000;z-index:10}
.pessoa{display:flex;gap:12px;padding:14px 15px;border-bottom:1px solid #1a1a1a;align-items:center}
.pessoa img{width:48px;height:48px;border-radius:50%;border:2px solid #222}
.btns{margin-left:auto;display:flex;gap:8px}
.btn{padding:7px 14px;border-radius:20px;border:none;font-weight:bold;font-size:13px;cursor:pointer}
.aceitar{background:#fff;color:#000}
.rejeitar{background:#1a1a1a;color:#fff}
.tabs{position:fixed;bottom:0;width:100%;display:flex;justify-content:space-around;background:#000;border-top:1px solid #222;padding:12px 0}
.tabs button{background:none;border:none;font-size:22px;opacity:0.5}
.tabs button.active{opacity:1}
</style>
</head>
<body>
<div class="header">Solicitações 👥</div>

<div class="pessoa">
  <img src="https://i.pravatar.cc/100?img=2">
  <div><b>João Cossa</b><br><small style="color:#888">Bilene • 2 amigos em comum</small></div>
  <div class="btns">
    <button class="btn aceitar" onclick="this.innerText='✓ Aceite'">Aceitar</button>
    <button class="btn rejeitar" onclick="this.parentElement.parentElement.remove()">X</button>
  </div>
</div>

<div class="pessoa">
  <img src="https://i.pravatar.cc/100?img=1">
  <div><b>Ana Massingue</b><br><small style="color:#888">Chissano • mora perto</small></div>
  <div class="btns">
    <button class="btn aceitar" onclick="this.innerText='✓ Aceite'">Aceitar</button>
    <button class="btn rejeitar" onclick="this.parentElement.parentElement.remove()">X</button>
  </div>
</div>

<div class="pessoa">
  <img src="https://i.pravatar.cc/100?img=8">
  <div><b>Carlos Mabjaia</b><br><small style="color:#888">Maputo • 5 amigos em comum</small></div>
  <div class="btns">
    <button class="btn aceitar" onclick="this.innerText='✓ Aceite'">Aceitar</button>
    <button class="btn rejeitar" onclick="this.parentElement.parentElement.remove()">X</button>
  </div>
</div>

<nav class="tabs">
  <button onclick="location.href='home.html'">🏠</button>
  <button class="active">👥</button>
  <button onclick="location.href='chat.html'">💬</button>
  <button onclick="location.href='notificacoes.html'">🔔</button>
  <button onclick="location.href='definicoes.html'">⚙️</button>
</nav>
</body>
</html>
