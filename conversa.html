<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Conversa</title>
<style>
body{margin:0;background:#000;color:#fff;font-family:sans-serif;display:flex;flex-direction:column;height:100vh;overflow:hidden}
header{background:#111;padding:10px 15px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #222}
.foto{width:36px;height:36px;background:#222;border-radius:50%;display:flex;align-items:center;justify-content:center}
.nome{font-weight:bold;font-size:14px}
.on{color:#0f0;font-size:11px}
.msgs{flex:1;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:8px}
.b{max-width:75%;padding:10px 12px;border-radius:18px;font-size:14px}
.eu{background:#ffcc00;color:#000;align-self:flex-end;border-bottom-right-radius:4px}
.outro{background:#222;align-self:flex-start;border-bottom-left-radius:4px}
.bar{padding:10px;background:#111;display:flex;gap:8px;align-items:center;border-top:1px solid #222}
.bar input{flex:1;background:#222;border:none;color:#fff;padding:12px 15px;border-radius:25px;outline:none}
.bar button{background:#ffcc00;border:none;width:42px;height:42px;border-radius:50%}
</style>
</head>
<body>
<header>
<span onclick="location.href='chat.html'" style="font-size:20px">←</span>
<div class="foto">👤</div>
<div style="flex:1"><div class="nome" id="n">Chat</div><div class="on">online • visto por último hoje</div></div>
<span>📞</span>
</header>
<div class="msgs" id="msgs"></div>
<div class="bar">
<input id="inp" placeholder="Mensagem...">
<button onclick="enviar()">➤</button>
</div>
<script>
let nome = localStorage.getItem('chat_atual')||'Maria Bilene';
document.getElementById('n').innerText=nome;
let chave='chat_'+nome;
let msgs = JSON.parse(localStorage.getItem(chave)||'null') || [
 {eu:false,texto:"Bro, tudo bem em Bilene?"},
 {eu:false,texto:"Tudo man! A lançar AfroTalk 😎"}
];
function render(){
 document.getElementById('msgs').innerHTML=msgs.map(m=>`<div class="b ${m.eu?'eu':'outro'}">${m.texto}</div>`).join('');
 let d=document.getElementById('msgs'); d.scrollTop=d.scrollHeight;
}
function enviar(){
 let i=document.getElementById('inp'); let t=i.value.trim(); if(!t)return;
 msgs.push({eu:true,texto:t}); localStorage.setItem(chave,JSON.stringify(msgs)); i.value=''; render();
 setTimeout(()=>{ msgs.push({eu:false,texto:"Recebido no Afrotalk 🔥"}); localStorage.setItem(chave,JSON.stringify(msgs)); render(); },600);
}
document.getElementById('inp').addEventListener('keypress',e=>{if(e.key=='Enter')enviar()});
render();
</script>
</body>
</html>
