<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{margin:0;background:#000;color:#fff;font-family:sans-serif;height:100vh;display:flex;flex-direction:column}
header{background:#111;padding:10px;display:flex;align-items:center;gap:10px}
#msgs{flex:1;overflow:auto;padding:15px;display:flex;flex-direction:column;gap:8px;padding-bottom:80px}
.m{max-width:75%;padding:10px 12px;border-radius:18px;font-size:14px}
.me{background:#ffcc00;color:#000;align-self:flex-end}
.other{background:#222;align-self:flex-start}
.bar{position:fixed;bottom:0;left:0;right:0;background:#111;padding:10px;display:flex;gap:8px;border-top:1px solid #222}
.bar input{flex:1;background:#222;border:0;color:#fff;padding:12px 15px;border-radius:25px;outline:none}
.bar button{background:#ffcc00;border:0;width:42px;height:42px;border-radius:50%}
</style></head>
<body>
<header><span onclick="history.back()">←</span><b id="nome">Chat</b><span style="color:#0f0;font-size:11px;margin-left:10px">online</span></header>
<div id="msgs"></div>
<div class="bar"><input id="inp" placeholder="Mensagem..."><button onclick="send()">➤</button></div>
<script>
let N=localStorage.getItem('chat_atual')||'Maria Bilene';
document.getElementById('nome').innerText=N;
let K='chat_'+N;
let M=JSON.parse(localStorage.getItem(K)||'null')||[{eu:0,t:"Bro, tudo bem em Bilene?"},{eu:0,t:"Tudo man! A lançar AfroTalk 😎"}];
function R(){document.getElementById('msgs').innerHTML=M.map(x=>`<div class="m ${x.eu?'me':'other'}">${x.t}</div>`).join('');let d=document.getElementById('msgs');d.scrollTop=d.scrollHeight}
function send(){let i=document.getElementById('inp');let t=i.value.trim();if(!t)return;M.push({eu:1,t:t});localStorage.setItem(K,JSON.stringify(M));i.value='';R();setTimeout(()=>{M.push({eu:0,t:"Recebido 🔥"});localStorage.setItem(K,JSON.stringify(M));R()},600)}
R();
document.getElementById('inp').addEventListener('keypress',e=>{if(e.key=='Enter')send()});
</script></body></html>
