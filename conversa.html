<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Afrotalk - Chat</title>
<style>
body{margin:0;background:#000;color:#fff;font-family:sans-serif;padding-bottom:70px}
header{padding:14px;background:#111;font-weight:bold;font-size:18px;position:sticky;top:0;display:flex;justify-content:space-between}
.search{margin:10px;background:#1a1a1a;border-radius:20px;padding:10px 15px;display:flex;gap:10px}
.search input{background:transparent;border:none;color:#fff;outline:none;width:100%}
.chat-item{display:flex;gap:12px;padding:12px 15px;border-bottom:1px solid #111;cursor:pointer}
.chat-item:active{background:#111}
.avatar{width:48px;height:48px;border-radius:50%;background:#333;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.info{flex:1;overflow:hidden}
.nome{font-weight:bold;font-size:15px}
.prev{color:#888;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.hora{color:#666;font-size:12px}
.tabs{position:fixed;bottom:0;left:0;right:0;background:#111;display:flex;justify-content:space-around;padding:10px 0;border-top:1px solid #222}
.tabs button{background:none;border:none;font-size:22px;cursor:pointer}
.online{width:10px;height:10px;background:#0f0;border-radius:50%;position:absolute;bottom:0;right:0;border:2px solid #000}
</style>
</head>
<body>

<header>
  <span>Mensagens</span>
  <span>✏️</span>
</header>

<div class="search">🔍<input placeholder="Pesquisar em Afrotalk"></div>

<div id="lista"></div>

<nav class="tabs">
  <button onclick="location.href='home.html'">🏠</button>
  <button onclick="location.href='solicitacoes.html'">👥</button>
  <button>💬</button>
  <button onclick="location.href='notificacoes.html'">🔔</button>
  <button onclick="location.href='definicoes.html'">⚙️</button>
</nav>

<script>
// pega amigos aceitos
let amigos = JSON.parse(localStorage.getItem('afro_amigos')||'[]');

let chatsFixos = [
  {nome:"João Cossa",msg:"Tudo man! A lançar AfroTalk 😎",hora:"14:23",foto:"🧑🏾",online:true},
  {nome:"Maria Bilene",msg:"Bro, tudo bem em Bilene?",hora:"13:10",foto:"👩🏾",online:true},
  {nome:"Afrotalk Oficial",msg:"Bem-vindo(a) ao AfroTalk...",hora:"ontem",foto:"🇲🇿",online:false},
];

let todos = [...amigos.map(a=>({nome:a,msg:"Agora vocês são amigos no Afrotalk!",hora:"agora",foto:"👤",online:true})), ...chatsFixos];

function render(){
  document.getElementById('lista').innerHTML = todos.map(c=>`
    <div class="chat-item" onclick="abrirChat('${c.nome}')">
      <div style="position:relative"><div class="avatar">${c.foto}</div>${c.online?'<div class="online"></div>':''}</div>
      <div class="info"><div class="nome">${c.nome}</div><div class="prev">${c.msg}</div></div>
      <div class="hora">${c.hora}</div>
    </div>
  `).join('');
}

function abrirChat(nome){
  localStorage.setItem('chat_atual',nome);
  location.href='conversa.html?v=1';
}

render();
</script>
</body>
</html>
