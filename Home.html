<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AfroTalk - Home</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
body{background:#000;color:#fff;padding-bottom:70px}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid #222;position:sticky;top:0;background:#000;z-index:10}
header b{font-size:20px;letter-spacing:0.5px}
.stories{display:flex;gap:14px;overflow-x:auto;padding:12px 16px;border-bottom:1px solid #111}
.stories::-webkit-scrollbar{display:none}
.story{text-align:center;min-width:60px}
.story img{width:60px;height:60px;border-radius:50%;border:3px solid #ff3b30;object-fit:cover;background:#222}
.story p{font-size:11px;margin-top:4px;color:#ccc;white-space:nowrap}
.post{border-bottom:1px solid #111}
.post-head{display:flex;gap:10px;padding:12px 16px;align-items:center}
.post-head img{width:32px;height:32px;border-radius:50%;background:#222}
.post-img{width:100%;max-height:420px;object-fit:cover;background:#111}
.actions{display:flex;justify-content:space-around;padding:10px 0;border-top:1px solid #111}
.actions span{padding:8px;font-size:14px}
.tabs{position:fixed;bottom:0;width:100%;display:flex;justify-content:space-around;background:#000;border-top:1px solid #222;padding:10px 0;z-index:20}
.tabs button{background:none;border:none;color:#fff;font-size:22px}
.perfil-box{margin:12px 16px;background:#0f0f0f;border:1px solid #222;border-radius:12px;padding:12px;font-size:13px;color:#888}
</style>
</head>
<body>

<header>
  <b>AfroTalk</b>
  <span>➕ 🔍</span>
</header>

<div class="perfil-box" id="perfil"></div>

<!-- STORIES -->
<div class="stories">
  <div class="story"><div style="width:60px;height:60px;border-radius:50%;border:3px solid #ff3b30;display:flex;align-items:center;justify-content:center;background:#222">👤</div><p>Teu story</p></div>
  <div class="story"><div style="width:60px;height:60px;border-radius:50%;border:3px solid #ff3b30;display:flex;align-items:center;justify-content:center;background:#222">J</div><p>João</p></div>
  <div class="story"><div style="width:60px;height:60px;border-radius:50%;border:3px solid #ff3b30;display:flex;align-items:center;justify-content:center;background:#222">M</div><p>Maria</p></div>
  <div class="story"><div style="width:60px;height:60px;border-radius:50%;border:3px solid #ff3b30;display:flex;align-items:center;justify-content:center;background:#222">A</div><p>Ana</p></div>
</div>

<!-- FEED -->
<div id="feed">
  <div class="post">
    <div class="post-head"><div style="width:32px;height:32px;border-radius:50%;background:#222;display:flex;align-items:center;justify-content:center">J</div> <b>João Cossa</b> <span style="color:#888;font-size:12px">• Chissano</span></div>
    <div class="post-img" style="height:280px;display:flex;align-items:center;justify-content:center;color:#555">🏖️ praia-bilene.jpg</div>
    <div class="actions">
      <span onclick="curtir(this)">❤️ 12</span>
      <span>💬 Comentar</span>
      <span>↗️ Partilhar</span>
    </div>
  </div>
  <div class="post">
    <div class="post-head"><div style="width:32px;height:32px;border-radius:50%;background:#222;display:flex;align-items:center;justify-content:center">M</div> <b>Maria</b> <span style="color:#888;font-size:12px">• Maputo</span></div>
    <div class="post-img" style="height:280px;display:flex;align-items:center;justify-content:center;color:#555">🔥 Feed Afrotalk funcionando!</div>
    <div class="actions">
      <span onclick="curtir(this)">❤️ 45</span>
      <span>💬 Comentar</span>
      <span>↗️ Partilhar</span>
    </div>
  </div>
</div>

<!-- ABAS EM BAIXO -->
<nav class="tabs">
  <button onclick="aba('home')">🏠</button>
  <button onclick="aba('solicitar')">👥</button>
  <button onclick="aba('chat')">💬</button>
  <button onclick="aba('notif')">🔔</button>
  <button onclick="aba('def')">⚙️</button>
</nav>

<script>
const u = JSON.parse(localStorage.getItem('afro_user')||'{}');
if(!u.nome) location.href='index.html';
document.getElementById('perfil').innerHTML = `👋 <b style="color:#fff">${u.nome}</b> • ${u.cidade}, ${u.pais} | ${u.genero}`;

function curtir(el){
  let n = parseInt(el.innerText.split(' ')[1]) + 1;
  el.innerText = '❤️ ' + n;
}
function aba(nome){
  if(nome=='solicitar') location.href='solicitar.html';
  if(nome=='chat') location.href='chat.html';
  if(nome=='notif') location.href='notificacoes.html';
  if(nome=='def') location.href='definicoes.html';
  if(nome=='home') window.scrollTo({top:0,behavior:'smooth'});
}
</script>
</body>
</html>
