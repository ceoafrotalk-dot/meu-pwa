<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Afrotalk - Home</title>
<style>
body{margin:0;background:#000;color:#fff;font-family:sans-serif;padding-bottom:70px}
header{padding:12px 15px;background:#111;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
.logo{color:#ffcc00;font-weight:bold;font-size:20px}
.criar{background:#1a1a1a;margin:10px;padding:12px;border-radius:12px}
.criar textarea{width:100%;background:#000;color:#fff;border:1px solid #333;border-radius:8px;padding:10px;resize:none;outline:none}
.btn-post{background:#ffcc00;color:#000;border:none;padding:8px 18px;border-radius:20px;font-weight:bold;margin-top:8px;float:right;cursor:pointer}
.feed{margin:10px}
.post{background:#1a1a1a;padding:12px;border-radius:12px;margin-bottom:10px}
.post .top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.avatar{width:36px;height:36px;background:#333;border-radius:50%;display:flex;align-items:center;justify-content:center}
.tabs{position:fixed;bottom:0;left:0;right:0;background:#111;display:flex;justify-content:space-around;padding:10px 0;border-top:1px solid #222}
.tabs button{background:none;border:none;font-size:22px;cursor:pointer}
</style>
</head>
<body>

<header>
  <div class="logo">Afrotalk</div>
  <div>🔍</div>
</header>

<div class="criar">
  <textarea id="texto" rows="3" placeholder="O que está a acontecer, CEO?"></textarea>
  <button class="btn-post" onclick="postar()">Publicar</button>
  <div style="clear:both"></div>
</div>

<div class="feed" id="feed"></div>

<nav class="tabs">
  <button onclick="aba('home')">🏠</button>
  <button onclick="aba('solicitacoes')">👥</button>
  <button onclick="aba('chat')">💬</button>
  <button onclick="aba('notif')">🔔</button>
  <button onclick="aba('def')">⚙️</button>
</nav>

<script>
let posts = JSON.parse(localStorage.getItem('afro_posts')||'null') || [
  {nome:"Afrotalk Oficial",texto:"Bem-vindo ao Afrotalk! A rede 100% moçambicana 🇲🇿",hora:"agora"},
  {nome:"João Cossa",texto:"Alguém em Bilene hoje? Vamos fazer um churrasco!",hora:"5 min"}
];

function render(){
  document.getElementById('feed').innerHTML = posts.map(p=>`
    <div class="post">
      <div class="top"><div class="avatar">👤</div><b>${p.nome}</b> <small style="color:#777">· ${p.hora}</small></div>
      <div>${p.texto}</div>
      <div style="margin-top:10px;color:#777;font-size:14px">❤️ Curtir · 💬 Comentar · ↗️ Partilhar</div>
    </div>
  `).join('');
}

function postar(){
  let t = document.getElementById('texto').value.trim();
  if(!t) return alert("Escreve algo!");
  posts.unshift({nome:"Tu",texto:t,hora:"agora"});
  localStorage.setItem('afro_posts',JSON.stringify(posts));
  document.getElementById('texto').value='';
  render();
}

function aba(nome){
  if(nome=='solicitacoes') location.href='solicitacoes.html';
  if(nome=='home') location.href='home.html';
  if(nome=='chat') location.href='chat.html';
  if(nome=='notif') location.href='notificacoes.html';
  if(nome=='def') location.href='definicoes.html';
}

render();
</script>
</body>
</html>
