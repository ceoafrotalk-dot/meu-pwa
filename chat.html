<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chat</title>
<style>
body{margin:0;background:#000;color:#fff;font-family:sans-serif;padding-bottom:70px}
header{padding:14px;background:#111;font-weight:bold;display:flex;justify-content:space-between;align-items:center}
.search{margin:10px;background:#1a1a1a;padding:10px 15px;border-radius:25px;display:flex;gap:10px}
.search input{background:none;border:none;color:#fff;outline:none;flex:1}
.item{display:flex;gap:12px;padding:12px 15px;border-bottom:1px solid #111;align-items:center}
.item:active{background:#111}
.foto{width:52px;height:52px;background:#222;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;position:relative}
.online-dot{position:absolute;bottom:0;right:0;width:12px;height:12px;background:#0f0;border-radius:50%;border:2px solid #000}
.info{flex:1}
.nome{font-weight:bold;font-size:15px}
.msg{color:#888;font-size:13px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}
.hora{color:#555;font-size:11px}
.tabs{position:fixed;bottom:0;left:0;right:0;background:#111;display:flex;justify-content:space-around;padding:10px 0;border-top:1px solid #222}
.tabs button{background:none;border:none;font-size:22px;opacity:.5}
.tabs button.ativo{opacity:1}
</style>
</head>
<body>
<header><span>💬 Mensagens</span><span>✏️</span></header>
<div class="search">🔍 <input placeholder="Pesquisar em Afrotalk"></div>

<div id="lista"></div>

<nav class="tabs">
<button onclick="location.href='home.html'">🏠</button>
<button onclick="location.href='solicitacoes.html'">👥</button>
<button class="ativo">💬</button>
<button onclick="location.href='notificacoes.html'">🔔</button>
<button onclick="location.href='definicoes.html'">⚙️</button>
</nav>

<script>
// LISTA FIXA + AMIGOS ACEITOS
let fixos = [
 {nome:"Afrotalk Oficial", msg:"Bem-vindo ao Afrotalk! 🇲🇿", hora:"agora"},
 {nome:"João Cossa", msg:"Tudo man! A lançar AfroTalk 😎", hora:"14:23"},
 {nome:"Maria Bilene", msg:"Bro, tudo bem em Bilene?", hora:"13:10"},
];

let amigos = JSON.parse(localStorage.getItem('amigos')||'[]');
let extras = amigos.map(n => ({nome:n, msg:"Novo amigo no Afrotalk!", hora:"hoje"}));

let todos = [...fixos, ...extras];

// Remove duplicados
let vistos = new Set();
let final = [];
todos.forEach(c=>{
  if(!vistos.has(c.nome)){ vistos.add(c.nome); final.push(c); }
});

function abrir(nome){
  localStorage.setItem('chat_atual', nome);
  location.href='conversa.html';
}

document.getElementById('lista').innerHTML = final.map(c=>`
<div class="item" onclick="abrir('${c.nome}')">
  <div class="foto">👤<div class="online-dot"></div></div>
  <div class="info">
    <div class="nome">${c.nome}</div>
    <div class="msg">${c.msg}</div>
  </div>
  <div class="hora">${c.hora}</div>
</div>
`).join('');

if(final.length==0){
  document.getElementById('lista').innerHTML='<p style="text-align:center;color:#777;margin-top:50px">Nenhuma conversa<br>Clica em 👥 e aceita amigos</p>';
}
</script>
</body>
</html>
